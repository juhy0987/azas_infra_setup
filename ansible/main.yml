---



  # 모든 대상 호스트 첫 부팅 처리: user1 + wheel + NOPASSWD + defaultkey 주입
- name: "Bootstrap all servers (user1 + defaultkey)"
  hosts: [On-Premise, EC2, DB]
  become: yes
  roles:
    - role: ec2_bootstrap

  # EC2 / 온프레미스 공통 셋업 (DB 는 제외)
- name: "Configure On-Premise / EC2 Servers"
  hosts: [On-Premise, EC2]
  become: yes
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"

  roles:
    - role: dependency_setup
    - role: node_exporter_setup

# 데이터베이스 서버 설정 (DB)
- name: "Configure Database Servers"
  hosts: DB
  become: yes
  roles:
    - role: postgresql_setup


# AWS EC2 인스턴스 설정 (EC2)
- name: "Configure AWS EC2 Instances"
  hosts: [On-Premise, EC2]
  become: no
  vars:
    deploy_branch: "main"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  roles:
    - role: service_deployment

- name: "Prometheus Galaxy 컬렉션 설치"
  hosts: localhost
  connection: local
  become: no

  roles:
    - role: monitor_setup
      become: yes