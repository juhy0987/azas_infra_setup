---
# EC2 Bootstrap Role Defaults (Amazon Ubuntu 전용)

# AMI 기본 접속 유저 (Ubuntu AMI)
bootstrap_remote_user: ubuntu

# 생성할 관리 유저
bootstrap_user: user1
bootstrap_user_shell: /bin/bash
bootstrap_admin_group: wheel

# Sudoers 설정
bootstrap_sudoers_file: "/etc/sudoers.d/{{ bootstrap_user }}"
bootstrap_sudoers_content: "{{ bootstrap_user }} ALL=(ALL) NOPASSWD: ALL"
bootstrap_sudoers_mode: "0440"

# 컨트롤러(현재 유저) 의 공개키 경로
bootstrap_public_key_path: "{{ lookup('env', 'HOME') }}/.ssh/defaultkey.pem.pub"

# authorized_keys 정책 (true 면 기존 키를 모두 대체)
bootstrap_authorized_key_exclusive: no
