---
# =========================
# 1. Tailscale 설치 및 설정
# =========================

- name: "1. Tailscale 설치"
  ansible.builtin.shell:
    cmd: "curl -fsSL https://tailscale.com/install.sh | sh"
    creates: /usr/bin/tailscale
  args:
    executable: /bin/bash

- name: "2. Tailscale 서비스 시작"
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: "3. IP 포워딩 활성화"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    reload: yes
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: "4. Tailscale 로그인 및 경로 광고 시작"
  ansible.builtin.command: >
    tailscale up
    --authkey={{ tailscale_auth_key }}
    --advertise-routes={{ aws_vpc_cidr }}
    --accept-routes
  register: tailscale_up_result
  changed_when: tailscale_up_result.rc == 0

# =========================
# 2. API 기반 route 승인
# =========================
- name: "1. 경로 전파 및 API 등록 대기"
  ansible.builtin.pause:
    seconds: 20
  delegate_to: localhost

- name: "2. Tailscale 기기 목록 조회"
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/{{ tailnet_name }}/devices"
    method: GET
    user: "{{ tailscale_api_key }}"
    password: ""
    force_basic_auth: yes
  register: tailscale_devices
  delegate_to: localhost
  
- name: "3. 전달받은 Hostname으로 즉시 ID 추출"
  ansible.builtin.set_fact:
    target_device_id: >-
      {{ tailscale_devices.json.devices | json_query(query) }}
  vars:
    query: "[?hostname=='{{ host_name }}'].id | [0]"
  delegate_to: localhost

- name: "4. VPC 라우트 승인 API 전송"
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/device/{{ target_device_id }}/routes"
    method: POST
    user: "{{ tailscale_api_key }}"
    password: ""
    force_basic_auth: yes
    body_format: json
    body:
      routes:
        - "{{ aws_vpc_cidr }}"
    status_code: 200
  when: target_device_id is defined and target_device_id != ""
  delegate_to: localhost

- name: "5. 최종 결과 디버깅"
  ansible.builtin.debug:
    msg: "host={{ host_name }}, device_id={{ target_device_id }}, route approved"