- name: "1. uv 설치 상태 확인"
  shell: which uv
  register: uv_check
  ignore_errors: yes
  changed_when: false

- name: "2. uv 미설치 시 자동 설치"
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  when: uv_check.rc != 0
  become: no  # 현재 접속 유저 권한으로 설치

- name: "3. uv 바이너리 경로 확정"
  set_fact:
    # which로 찾았으면 그 경로를 쓰고, 아니면 기본 설치 경로(/home/유저/.local/bin/uv)를 강제함
    uv_bin: "{{ uv_check.stdout if uv_check.rc == 0 else '/home/' + (ansible_user | default(lookup('env', 'BOOTSTRAP_USER')) | default('user1')) + '/.local/bin/uv' }}"

- name: "4. 사용될 uv 경로 확인"
  debug:
    msg: "Target 호스트에서 사용할 uv 경로: {{ uv_bin }}"