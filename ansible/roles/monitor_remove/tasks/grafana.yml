---
# [1~3번] 서비스가 떠있을 때 API로 먼저 삭제 (순서가 제일 중요!)
- name: "1. Grafana 알람 규칙 제거 (API)"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/provisioning/alert-rules/{{ item }}"
    method: DELETE
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
    status_code: [200, 204, 404]
  loop:
    - "CPU_Overload_Alert"
    - "Memory_High_Usage_Alert"
    - "High_Traffic_Alert"
  failed_when: false

- name: "2. Grafana 알람 폴더 제거 (API)"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/folders/monitoring"
    method: DELETE
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
    status_code: [200, 204, 404]
  failed_when: false

- name: "3. Grafana 텔레그램 Contact Point 제거 (API)"
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/provisioning/contact-points/AZAS_Telegram_Alert"
    method: DELETE
    user: "{{ grafana_admin_user }}"
    password: "{{ grafana_admin_password }}"
    force_basic_auth: yes
    status_code: [200, 204, 404]
  failed_when: false


- name: "4. Grafana 서비스 중지 및 비활성화"
  systemd:
    name: grafana-server
    state: stopped
    enabled: no
  failed_when: false

# --- RedHat 계열 ---
- name: "5. Grafana 패키지 제거 (RedHat)"
  dnf:
    name: grafana
    state: absent
  when: ansible_os_family == "RedHat"

- name: "6. Grafana YUM 저장소 제거 (RedHat)"
  file:
    path: "{{ grafana_repo_path_redhat }}"
    state: absent
  when: ansible_os_family == "RedHat"

# --- Debian 계열 ---
- name: "7. Grafana 패키지 제거 (Debian)"
  apt:
    name: grafana
    state: absent
    purge: yes
  when: ansible_os_family == "Debian"

- name: "8. Grafana APT 저장소 제거 (Debian)"
  apt_repository:
    repo: "{{ grafana_apt_repo }}"
    state: absent
    filename: "{{ grafana_apt_repo_filename }}"
  when: ansible_os_family == "Debian"

- name: "9. Grafana GPG 키 제거 (Debian)"
  apt_key:
    url: "{{ grafana_apt_key_url }}"
    state: absent
  when: ansible_os_family == "Debian"


- name: "10. Grafana 잔여 데이터 및 설정 디렉토리 완전 삭제"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/var/lib/grafana"
    - "/etc/grafana"